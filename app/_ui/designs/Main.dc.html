<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Afterhours</title>
<script src="./support.js"></script>
<script src="/_blob/75b8bb113279e65c4b91a40d667f9598"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&amp;family=Geist+Mono:wght@400;500&amp;family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600&amp;display=swap">
<style>
body{margin:0;background:#07050F}
a{color:#F2F6FF}a:hover{color:#FFFFFF}
@keyframes plumbRiseWord{from{opacity:0;transform:translateY(40px) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes plumbFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 100vh; min-height: 680px; overflow: hidden; background: #07050F; color: #F2F6FF; font-family: Geist, system-ui, sans-serif">
  <canvas ref="{{setCanvas}}" data-plumb-shop="night" role="img" aria-label="A small business on a neon city block at night, cut open like a dollhouse, with Grok bots finding where money leaks" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block"></canvas>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,5,15,.88) 0%, rgba(7,5,15,.55) 38%, rgba(7,5,15,0) 62%), linear-gradient(0deg, rgba(7,5,15,.85) 0%, rgba(7,5,15,0) 30%); pointer-events: none"></div>
  <div style="position: absolute; inset: 0; box-sizing: border-box; padding: 28px 40px 32px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; pointer-events: none">
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <div style="font-weight: 800; font-size: 28px; letter-spacing: -0.055em">afterhours</div>
      <div style="font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #A9B4D6">Built with Grok Bot</div>
    </header>
    <main style="max-width: 600px; display: flex; flex-direction: column; align-items: flex-start; gap: 32px">
      <h1 style="margin: 0; font-family: 'Chakra Petch', Geist, sans-serif; font-weight: 400; font-size: clamp(56px, 7.2vw, 108px); line-height: 0.95; letter-spacing: -0.01em">
        <span style="display: block; animation: plumbRiseWord 900ms cubic-bezier(.34,1.56,.64,1) both">You close at 6.</span>
        <span style="display: block; color: #8A93B8; font-style: italic; animation: plumbRiseWord 900ms 140ms cubic-bezier(.34,1.56,.64,1) both">Your crew starts at 6:01.</span>
      </h1>
      <a href="Shop.dc.html" style="pointer-events: auto; display: inline-flex; align-items: center; justify-content: center; min-height: 72px; padding: 0 44px; border-radius: 999px; background: {{accent}}; color: #F2F6FF; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; text-decoration: none; animation: plumbFade 700ms 420ms cubic-bezier(.22,1,.36,1) both">Send in the crew</a>
    </main>
    <footer style="display: flex; flex-direction: column; gap: 10px; animation: plumbFade 700ms 600ms cubic-bezier(.22,1,.36,1) both">
      <div style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #A9B4D6">The crew · six Grok Bots on the night shift</div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px">
      <sc-for list="{{crew}}" as="w" hint-placeholder-count="6">
        <div style="display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: rgba(242, 246, 255, 0.06); border: 1px solid rgba(242, 246, 255, 0.12)">
          <svg width="40" height="40" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true" style="flex: none; border-radius: 8px; background: rgba(242, 246, 255, 0.08); outline: 2px solid {{w.color}}; outline-offset: -2px">
            <sc-for list="{{w.px}}" as="p" hint-placeholder-count="40">
              <rect x="{{p.x}}" y="{{p.y}}" width="1" height="1" fill="{{p.c}}"></rect>
            </sc-for>
          </svg>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><span style="font-weight: 600; font-size: 15px">{{w.name}}</span><span style="padding: 0 6px; border-radius: 999px; background: {{w.color}}; color: #F2F6FF; font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: 0.1em; line-height: 16px">GROK BOT</span></div>
            <div style="font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #8A93B8">{{w.role}}</div>
            <div style="font-size: 12.5px; line-height: 1.3; color: #A9B4D6">{{w.job}}</div>
          </div>
        </div>
      </sc-for>
      </div>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2189E","options":["#C2189E","#7B2FF7","#0077A8","#0A0714"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.ctrl = null;
    this.canvasEl = null;
    this.tries = 0;
    this.setCanvas = (el) => {
      if (el && el !== this.canvasEl) { this.canvasEl = el; this.mountShop(); }
    };
  }
  componentDidMount() {
    if (!this.canvasEl) this.canvasEl = document.querySelector('canvas[data-plumb-shop="night"]');
    this.mountShop();
  }
  componentWillUnmount() {
    clearTimeout(this.retry);
    if (this.ctrl) this.ctrl.destroy();
    this.ctrl = null;
  }
  mountShop() {
    if (this.ctrl || !this.canvasEl) return;
    if (!window.PlumbShop) {
      if (this.tries++ < 60) this.retry = setTimeout(() => this.mountShop(), 150);
      return;
    }
    this.ctrl = window.PlumbShop.mount(this.canvasEl, { mode: 'night' });
  }
  portrait(id, color) {
    // A Grok bot, 8x8: antenna, chrome head, dark visor with glowing eyes, chest light.
    const grid = ['...a....', '.mmmmmm.', 'mmmmmmmm', 'mvvvvvvm', 'mvgvvgvm', 'mmmmmmmm', '.mmggmm.', 'gmmmmmmg'];
    const colors = { m: '#DFE6EF', v: '#05070D', g: color, a: color };
    const px = [];
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      const ch = grid[y][x];
      if (ch !== '.') px.push({ x, y, c: colors[ch] });
    }
    return px;
  }
  renderVals() {
    const crew = [
      { id: 'rosa', name: 'Rosa', role: 'Night manager', color: '#FF3BD4', job: 'Runs the shift and texts you what the crew found.' },
      { id: 'vic', name: 'Vic', role: 'Price checker', color: '#39E8FF', job: 'Walks the street and compares your prices.' },
      { id: 'june', name: 'June', role: 'Listener', color: '#FFC23D', job: 'Reads every review and X post about you.' },
      { id: 'otto', name: 'Otto', role: 'Storefront', color: '#8F6BFF', job: 'Checks your website, links and listings.' },
      { id: 'lou', name: 'Lou', role: 'Bookkeeper', color: '#39FF9F', job: 'Unpacks the books you upload. Catches bills paid twice.' },
      { id: 'fern', name: 'Fern', role: 'Fixer', color: '#FF6A3D', job: 'Drafts the fixes: new prices, replies, emails.' },
    ].map((w) => ({ ...w, px: this.portrait(w.id, w.color) }));
    return { accent: this.props.accent ?? '#C2189E', crew, setCanvas: this.setCanvas };
  }
}
</script>
</body>
</html>
